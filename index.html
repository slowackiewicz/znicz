<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Znicz</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at center, #1a1a1a 0%, #090909 55%, #000 100%);
    overflow: hidden;
    font-family: "Georgia", serif;
}
.scene {
    display: flex;
    flex-direction: column;
    align-items: center;
}
.glow {
    position: absolute;
    width: 320px;
    height: 320px;
    background: radial-gradient(
        circle,
        rgba(255,170,40,.17) 0%,
        rgba(255,120,0,.08) 35%,
        transparent 75%
    );
    filter: blur(30px);
    animation: pulse 3s ease-in-out infinite;
}
.flame {
    position: relative;
    width: 36px;
    height: 70px;
    margin-bottom: -5px;
    z-index: 2;
}
.flame::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 34px;
    height: 64px;
    transform: translateX(-50%);
    background: linear-gradient(
        to top,
        #ff7b00 0%,
        #ffb300 45%,
        #fff4c4 75%,
        #ffffff 100%
    );
    clip-path: polygon(
        50% 0%,
        68% 18%,
        82% 42%,
        74% 72%,
        50% 100%,
        26% 72%,
        18% 42%,
        32% 18%
    );
    filter: drop-shadow(0 0 12px rgba(255,180,60,.7));
    animation: flicker 1.5s ease-in-out infinite;
}
.flame::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 10px;
    width: 16px;
    height: 32px;
    transform: translateX(-50%);
    background: linear-gradient(
        to top,
        #fff0b0,
        #ffffff
);
    clip-path: polygon(
        50% 0%,
        70% 25%,
        80% 50%,
        50% 100%,
        20% 50%,
        30% 25%
    );
    opacity: 0.95;
}
.wick {
    width: 15px;
    height: 18px;
    background: #2e2e2e;
    margin-top: -8px;
    z-index: 3;
}
.candle {
    position: relative;
    width: 240px;
    height: 90px;
    border-radius: 0 0 120px 120px;
    background:
        linear-gradient(
            to bottom,
            #7e3424,
            #5a2018 35%,
            #3d130f 100%
        );
    box-shadow:
        0 20px 35px rgba(0,0,0,.65),
        inset 0 1px 3px rgba(255,255,255,.15);
}
.candle::before {
    content: "";
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 250px;
    height: 38px;
    border-radius: 50%;
    background:
        linear-gradient(to bottom,
        #c57d61,
        #8c4734);
    box-shadow: inset 0 2px 4px rgba(255,255,255,.12);
}
.candle::after {
    content: "";
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 170px;
    height: 15px;
    border-radius: 50%;
    background: rgba(255,240,210,.35);
}
.text {
    margin-top: 70px;
    text-align: center;
    color: #e5dccf;
    letter-spacing: 0.25em;
}
.text h1 {
    font-size: 2.4rem;
    font-weight: normal;
}
.text p {
    margin-top: 12px;
    color: #9b968f;
    font-size: 0.95rem;
    letter-spacing: 0.12em;
}
@keyframes flicker {
    0%,100% {
        transform: translateX(-50%) rotate(-4deg) scaleY(1);
    }
    25% {
        transform: translateX(-48%) rotate(2deg) scaleY(1.05);
    }
    50% {
        transform: translateX(-52%) rotate(-2deg) scaleY(.96);
    }
    75% {
        transform: translateX(-49%) rotate(3deg) scaleY(1.03);
    }
}
@keyframes flickerInner {
    0%,100% { opacity: 1; }
    50% { opacity: .72; }
}
@keyframes pulse {
    0%,100% {
        transform: scale(1);
        opacity: .8;
    }
    50% {
        transform: scale(1.12);
        opacity: 1;
    }
}
</style>
</head>
<body>
    <div class="scene">
        <div class="glow"></div>
        <div class="flame"></div>
        <div class="wick"></div>
        <div class="candle"></div>
        <div class="text">
            <h1>Memento mori</h1>
            <p>Z prochu powstałeś i w proch się obrócisz.</p>
        </div>
    </div>
</body>
</html>
