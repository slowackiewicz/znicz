<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Znicz</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at center, #1a1a1a 0%, #090909 55%, #000 100%);
    overflow: hidden;
    font-family: "Georgia", serif;
}
.scene {
    display: flex;
    flex-direction: column;
    align-items: center;
}
.flame-area {
    position: relative;
    width: 220px;
    height: 210px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    margin-bottom: -16px;
    z-index: 2;
}
.glow {
    position: absolute;
    left: 50%;
    top: 48%;
    border-radius: 50%;
    pointer-events: none;
    will-change: transform, opacity;
}
.glow-outer {
    width: 460px;
    height: 460px;
    background: radial-gradient(
        circle,
        rgba(255, 168, 45, .30) 0%,
        rgba(255, 120, 0, .16) 28%,
        rgba(255, 90, 0, .06) 52%,
        transparent 72%
    );
    filter: blur(22px);
    animation: glowPulse 3.2s ease-in-out infinite;
}
.glow-inner {
    width: 190px;
    height: 190px;
    background: radial-gradient(
        circle,
        rgba(255, 236, 180, .55) 0%,
        rgba(255, 170, 50, .30) 38%,
        transparent 70%
    );
    filter: blur(16px);
    animation: glowPulse 1.9s ease-in-out infinite reverse;
}
.flame {
    position: absolute;
    bottom: 16px;
    left: 50%;
    width: 58px;      /* 72px - 20% */
    height: 115px;    /* 144px - 20% */
    transform: translateX(-50%);
    overflow: visible;
    z-index: 3;
}
.flame-group {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: flameSway 3.1s ease-in-out infinite;
    will-change: transform;
}
.wick {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 15px;
    height: 18px;
    background: #2e2e2e;
    z-index: 2;
}
.sparks {
    position: absolute;
    left: 50%;
    bottom: 74px;
    width: 0;
    height: 0;
    z-index: 4;
    pointer-events: none;
}
.spark {
    position: absolute;
    left: 0;
    bottom: 0;
    width: var(--s, 3px);
    height: var(--s, 3px);
    border-radius: 50%;
    background: radial-gradient(circle, #fffce8 0%, #ffc93c 55%, #ff6a00 100%);
    box-shadow: 0 0 8px 2px rgba(255, 170, 45, .85);
    opacity: 0;
    animation: sparkRise var(--dur, 2.8s) linear var(--delay, 0s) infinite;
    will-change: transform, opacity;
}
.candle {
    position: relative;
    width: 240px;
    height: 90px;
    border-radius: 0 0 120px 120px;
    background:
        linear-gradient(
            to bottom,
            #7e3424,
            #5a2018 35%,
            #3d130f 100%
        );
    box-shadow:
        0 20px 35px rgba(0, 0, 0, .65),
        inset 0 1px 3px rgba(255, 255, 255, .15);
}
.candle::before {
    content: "";
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 250px;
    height: 38px;
    border-radius: 50%;
    background:
        linear-gradient(to bottom, #c57d61, #8c4734);
    box-shadow:
        inset 0 2px 4px rgba(255, 255, 255, .12);
}
.candle::after {
    content: "";
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 170px;
    height: 15px;
    border-radius: 50%;
    background: rgba(255, 240, 210, .35);
}
.text {
    margin-top: 70px;
    text-align: center;
    color: #e5dccf;
    letter-spacing: .25em;
}
.text h1 {
    font-size: 2.4rem;
    font-weight: normal;
}
.text p {
    margin-top: 12px;
    color: #9b968f;
    font-size: .95rem;
    letter-spacing: .12em;
}
@keyframes glowPulse {
    0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: .82;
    }
    50% {
        transform: translate(-50%, -50%) scale(1.13);
        opacity: 1;
    }
}
@keyframes flameSway {
    0%, 100% {
        transform: scale(1, 1) rotate(0deg);
    }
    18% {
        transform: scale(1.035, .965) rotate(1.3deg);
    }
    38% {
        transform: scale(.968, 1.045) rotate(-1.1deg);
    }
    58% {
        transform: scale(1.02, .98) rotate(1.6deg);
    }
    78% {
        transform: scale(.98, 1.025) rotate(-.9deg);
    }
}
@keyframes sparkRise {
    0% {
        transform: translate(var(--x, 0px), 0) scale(.4);
        opacity: 0;
    }
    10% {
        opacity: 1;
    }
    65% {
        opacity: .85;
    }
    100% {
        transform: translate(calc(var(--x, 0px) + var(--dx, 0px)), -165px) scale(.1);
        opacity: 0;
    }
}
@media (prefers-reduced-motion: reduce) {
    * {
        animation-duration: .001s !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>
<body>
    <div class="scene">
        <div class="flame-area">
            <div class="glow glow-outer"></div>
            <div class="glow glow-inner"></div>
             <div class="sparks">
                <span class="spark" style="--x:-9px;  --dx:-24px; --dur:2.9s; --delay:0s;   --s:3px;"></span>
                <span class="spark" style="--x:6px;   --dx:18px;  --dur:2.3s; --delay:.35s; --s:2.5px;"></span>
                <span class="spark" style="--x:-3px;  --dx:-14px; --dur:3.4s; --delay:.9s;  --s:2px;"></span>
                <span class="spark" style="--x:11px;  --dx:26px;  --dur:2.7s; --delay:1.4s; --s:3.5px;"></span>
                <span class="spark" style="--x:-14px; --dx:-30px; --dur:3.1s; --delay:.6s;  --s:2px;"></span>
                <span class="spark" style="--x:2px;   --dx:10px;  --dur:2.1s; --delay:1.8s; --s:2.5px;"></span>
                <span class="spark" style="--x:-6px;  --dx:-8px;  --dur:3.6s; --delay:2.3s; --s:3px;"></span>
                <span class="spark" style="--x:8px;   --dx:22px;  --dur:2.5s; --delay:2.8s; --s:2px;"></span>
                <span class="spark" style="--x:-11px; --dx:-20px; --dur:2.8s; --delay:3.2s; --s:3.5px;"></span>
                <span class="spark" style="--x:4px;   --dx:-16px; --dur:3.2s; --delay:3.7s; --s:2.5px;"></span>
                <span class="spark" style="--x:-1px;  --dx:14px;  --dur:2.6s; --delay:4.1s; --s:2px;"></span>
                <span class="spark" style="--x:12px;  --dx:8px;   --dur:3.5s; --delay:4.6s; --s:3px;"></span>
            </div>
             <svg class="flame" viewBox="0 0 100 200" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
                <defs>
                    <radialGradient id="flameOuter" cx="50%" cy="72%" r="72%">
                        <stop offset="0%"   stop-color="#fffbe0"/>
                        <stop offset="20%"  stop-color="#ffe98f"/>
                        <stop offset="45%"  stop-color="#ffbe3d"/>
                        <stop offset="70%"  stop-color="#ff7d0c"/>
                        <stop offset="88%"  stop-color="#ef4a00"/>
                        <stop offset="100%" stop-color="#b31d00"/>
                    </radialGradient>
                    <radialGradient id="flameInner" cx="50%" cy="66%" r="62%">
                        <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
                        <stop offset="38%"  stop-color="#fff5bb" stop-opacity=".95"/>
                        <stop offset="72%"  stop-color="#ffcf5a" stop-opacity=".5"/>
                        <stop offset="100%" stop-color="#ff9a1a" stop-opacity="0"/>
                    </radialGradient>
                    <radialGradient id="flameBlue" cx="50%" cy="50%" r="50%">
                        <stop offset="0%"   stop-color="#bfe4ff" stop-opacity=".9"/>
                        <stop offset="50%"  stop-color="#4a9dff" stop-opacity=".45"/>
                        <stop offset="100%" stop-color="#1b4bff" stop-opacity="0"/>
                    </radialGradient>
                    <filter id="soften" x="-40%" y="-30%" width="180%" height="170%">
                        <feGaussianBlur stdDeviation="0.9"/>
                    </filter>
                    <filter id="innerBlur" x="-60%" y="-50%" width="220%" height="210%">
                        <feGaussianBlur stdDeviation="2.4"/>
                    </filter>
                   <path id="flameShape"
                          d="M50,6 C60,50 86,88 86,134 C86,170 69,190 50,190 C31,190 14,170 14,134 C14,88 40,50 50,6 Z">
                        <animate
                            attributeName="d"
                            dur="2.2s"
                            repeatCount="indefinite"
                            calcMode="spline"
                            keyTimes="0;0.22;0.45;0.7;1"
                            keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
                            values="
                                M50,6  C60,50 86,88 86,134 C86,170 69,190 50,190 C31,190 14,170 14,134 C14,88 40,50 50,6  Z;
                                M54,2  C64,46 89,86 89,132 C89,170 70,190 50,190 C31,190 14,170 14,132 C14,86 42,52 54,2  Z;
                                M50,11 C58,54 84,90 84,136 C84,172 68,191 50,191 C31,191 15,172 15,136 C15,90 42,52 50,11 Z;
                                M45,8  C55,52 82,88 82,134 C82,171 67,191 50,191 C32,191 17,171 17,134 C17,88 38,50 45,8  Z;
                                M50,6  C60,50 86,88 86,134 C86,170 69,190 50,190 C31,190 14,170 14,134 C14,88 40,50 50,6  Z
                            "/>
                    </path>
                </defs>
                <g class="flame-group">
                    <use href="#flameShape" fill="url(#flameOuter)" filter="url(#soften)"/>
                    <ellipse cx="50" cy="172" rx="16" ry="13"
                             fill="url(#flameBlue)" filter="url(#innerBlur)"/>
                    <use href="#flameShape" fill="url(#flameInner)" filter="url(#innerBlur)"
                         transform="translate(50,190) scale(0.62) translate(-50,-190)"/>
                </g>
            </svg>
            <div class="wick"></div>
        </div>
        <div class="candle"></div>
        <div class="text">
            <h1>Memento mori</h1>
            <p>Z prochu powstałeś i w proch się obrócisz.</p>
        </div>
    </div>
</body>
</html>
