<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memento Mori</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at center, #1a1a1a 0%, #090909 55%, #000 100%);
    overflow: hidden;
    font-family: "Georgia", serif;
}

.scene {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Aura światła */
.glow {
    position: absolute;
    width: 320px;
    height: 320px;
    background: radial-gradient(
        circle,
        rgba(255,170,40,.17) 0%,
        rgba(255,120,0,.08) 35%,
        transparent 75%
    );
    filter: blur(30px);
    animation: pulse 3s ease-in-out infinite;
}

/* Płomień */
.flame {
    position: relative;
    width: 52px;
    height: 95px;
    margin-bottom: -8px;
    z-index: 2;
}

.flame::before,
.flame::after {
    content: "";
    position: absolute;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 50% 50% 45% 45%;
}

.flame::before {
    width: 52px;
    height: 90px;
    transform: translateX(-50%) rotate(-3deg);
    background:
        radial-gradient(circle at 50% 30%,
        #fffef5 0%,
        #fff6bc 22%,
        #ffd261 55%,
        #ff8f1f 80%,
        #ff6200 100%);
    filter: blur(.5px);
    animation: flicker 1.6s ease-in-out infinite;
}

.flame::after {
    width: 26px;
    height: 48px;
    background:
        radial-gradient(circle at 50% 25%,
        #ffffff 0%,
        #fff4d8 60%,
        rgba(255,255,255,.2) 100%);
    transform: translateX(-50%);
    animation: flickerInner 1.2s ease-in-out infinite;
}

/* Knot */
.wick {
    width: 6px;
    height: 18px;
    background: #2e2e2e;
    border-radius: 4px;
    margin-top: -8px;
    z-index: 3;
}

/* Znicz */
.candle {
    position: relative;
    width: 240px;
    height: 90px;
    border-radius: 0 0 120px 120px;
    background:
        linear-gradient(
            to bottom,
            #7e3424,
            #5a2018 35%,
            #3d130f 100%
        );
    box-shadow:
        0 20px 35px rgba(0,0,0,.65),
        inset 0 1px 3px rgba(255,255,255,.15);
}

.candle::before {
    content: "";
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 250px;
    height: 38px;
    border-radius: 50%;
    background:
        linear-gradient(to bottom,
        #c57d61,
        #8c4734);
    box-shadow: inset 0 2px 4px rgba(255,255,255,.12);
}

.candle::after {
    content: "";
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 170px;
    height: 15px;
    border-radius: 50%;
    background: rgba(255,240,210,.35);
}

/* Napis */
.text {
    margin-top: 70px;
    text-align: center;
    color: #e5dccf;
    letter-spacing: 0.25em;
}

.text h1 {
    font-size: 2.4rem;
    font-weight: normal;
}

.text p {
    margin-top: 12px;
    color: #9b968f;
    font-size: 0.95rem;
    letter-spacing: 0.12em;
}

@keyframes flicker {
    0%,100% {
        transform: translateX(-50%) rotate(-4deg) scaleY(1);
    }
    25% {
        transform: translateX(-48%) rotate(2deg) scaleY(1.05);
    }
    50% {
        transform: translateX(-52%) rotate(-2deg) scaleY(.96);
    }
    75% {
        transform: translateX(-49%) rotate(3deg) scaleY(1.03);
    }
}

@keyframes flickerInner {
    0%,100% { opacity: 1; }
    50% { opacity: .72; }
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
        opacity: .8;
    }
    50% {
        transform: scale(1.12);
        opacity: 1;
    }
}
</style>
</head>
<body>

<div class="scene">
    <div class="glow"></div>

    <div class="flame"></div>
    <div class="wick"></div>

    <div class="candle"></div>

    <div class="text">
        <h1>Memento mori</h1>
        <p>Pamięć trwa dłużej niż przemijanie.</p>
    </div>
</div>

</body>
</html>
